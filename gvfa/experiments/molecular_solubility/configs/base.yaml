# Baseline molecular-solubility config.
#
# Atoms-only GVFA with Gaussian random projection, sign normalization,
# 3 layers (Φ3), sum-pooling, ridge regression. No edge binder, no
# augmentation, no bounded scaling.
#
# Mirrors the legacy `Molecular_Solubility/GVFA/GVFA_main.py` setup.

seed: 42

dataset:
  kind: csv
  csv_path: data/solubility/train.csv
  test_csv_path: data/solubility/test.csv
  smiles_col: smiles_canon
  target_col: LogS

split:
  kind: explicit       # use the explicit train/test CSVs

featurizer:
  atom_features:
    - atomic_number
    - degree
    - valence_electrons
    - hybridization
    - hbond_flags
  bond_features: null  # atoms only — no bond featurizer
  descriptors: false

projection:
  D: 5000
  kind: gaussian
  seed: 42
  sign_normalize: true
  scaler:
    enabled: false

edge_binder:
  kind: none

encoder:
  num_layers: 3
  phi: phi3
  normalize: sign

augmentation:
  kind: null

pooler:
  kind: sum

head:
  kind: ridge
  alpha: 1.0

logging:
  out_dir: results/molecular_solubility
  run_name: base
